<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#0A1B33" />

    <title>Ripple Good: make the biggest ripple.</title>
    <meta
      name="description"
      content="Ripple Good names the best-evidenced charity in each cause, from global health to climate to animal welfare, translating the research of GiveWell, Animal Charity Evaluators, Giving Green and Founders Pledge."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ripple Good" />
    <meta property="og:title" content="Ripple Good: make the biggest ripple." />
    <meta
      property="og:description"
      content="The most effective charity within the cause you already care about. Results first, math underneath."
    />
    <meta property="og:url" content="https://ripple-good.org/" />
    <!-- VERIFY: absolute URL, so it must match the site's real home. Built by
         scripts/build-og-images.mjs; per-cause previews live at /share/<id>. -->
    <meta property="og:image" content="https://ripple-good.org/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ripple-good.org/og/default.png" />

    <script>
      // Legacy links. This site used a HashRouter, so URLs already in the wild
      // look like /#/cause/climate. Real paths are served now, so translate on
      // arrival — before React mounts, and with replace() so the old form never
      // enters history. Anything that isn't a "#/" route is left alone.
      (function () {
        function migrate() {
          var h = window.location.hash;
          if (h.indexOf("#/") !== 0) return;
          window.location.replace(
            window.location.pathname.replace(/\/$/, "") +
              h.slice(1) +
              window.location.search,
          );
        }
        migrate();
        // A hash-only change is a same-document navigation: nothing reloads and
        // this file never runs again. An in-page legacy link would otherwise
        // sit there doing nothing at all.
        window.addEventListener("hashchange", migrate);
      })();
    </script>

    <!-- Self-hosted. A site that tells people "we never see your details"
         shouldn't hand Google a request, and an IP address, on every load.
         Subset to Latin and woff2: five faces, ~76KB, no third-party origin.
         Regenerate with scripts/fonts/README.md. -->
    <link
      rel="preload"
      href="/fonts/poppins-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- VERIFY: the urls below assume the final home is https://ripple-good.org/ —
         update them if the site ships on a github.io address instead. -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Ripple Good",
          "url": "https://ripple-good.org/",
          "logo": "https://ripple-good.org/favicon.svg",
          "slogan": "One goal: the most good for every dollar.",
          "description": "An effective-giving directory: the best-evidenced charity within each cause, translating the research of GiveWell, Animal Charity Evaluators, Giving Green and Founders Pledge."
        },
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Ripple Good",
          "url": "https://ripple-good.org/"
        }
      ]
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
