<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything other than zero. Without it the sticky header sits under the
         Dynamic Island and the give bar sits on the home indicator, however
         carefully the stylesheet asks for the inset. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Root-absolute, not "./": these pages are prerendered to real files at
         nested paths, so a relative href resolved against /cause/<id>/ and
         404'd on every page but the home page. Vite prepends `base` to these
         at build time, so they survive a move to a project-page URL. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A1B33" />

    <!-- iOS ignores SVG icons for "Add to Home Screen" and screenshots the page
         instead. The manifest covers Android; the two PNG sizes it names are
         built by scripts/build-icons.mjs.

         Absolute paths inside site.webmanifest are correct only while the site
         is served from a domain root, which public/CNAME makes true. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Ripple Good" />

    <!-- VERIFY: absolute URL, so it must match the site's real home. Built by
         scripts/build-og-images.mjs; per-cause previews live at /share/<id>. -->
    <script>
      // Legacy links. This site used a HashRouter, so URLs already in the wild
      // look like /#/cause/climate. Real paths are served now, so translate on
      // arrival — before React mounts, and with replace() so the old form never
      // enters history. Anything that isn't a "#/" route is left alone.
      (function () {
        function migrate() {
          var h = window.location.hash;
          if (h.indexOf("#/") !== 0) return;
          window.location.replace(
            window.location.pathname.replace(/\/$/, "") +
              h.slice(1) +
              window.location.search,
          );
        }
        migrate();
        // A hash-only change is a same-document navigation: nothing reloads and
        // this file never runs again. An in-page legacy link would otherwise
        // sit there doing nothing at all.
        window.addEventListener("hashchange", migrate);
      })();
    </script>

    <!-- Self-hosted. A site that tells people "we never see your details"
         shouldn't hand Google a request, and an IP address, on every load.
         Subset to Latin and woff2: five faces, ~76KB, no third-party origin.
         Regenerate with scripts/fonts/README.md. -->
    <link
      rel="preload"
      href="/fonts/poppins-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- VERIFY: the urls below assume the final home is https://ripple-good.org/ —
         update them if the site ships on a github.io address instead. -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Ripple Good",
          "url": "https://ripple-good.org/",
          "logo": "https://ripple-good.org/favicon.svg",
          "founder": { "@type": "Person", "name": "Ian Sorensen" },
          "slogan": "One goal: the most good for every dollar.",
          "description": "An effective-giving directory: the best-evidenced charity within each cause, translating the research of GiveWell and Animal Charity Evaluators."
        },
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Ripple Good",
          "url": "https://ripple-good.org/"
        }
      ]
    </script>
    <script type="module" crossorigin src="/assets/index-DKf_AH0c.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vendor-CGrPmlad.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CBYMvRRp.css">
    <title>Ripple Good: make the biggest ripple.</title>
    <link rel="canonical" href="https://ripple-good.org/" />
    <meta name="description" content="One evidence-backed charity per cause." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ripple Good" />
    <meta property="og:title" content="Ripple Good: make the biggest ripple." />
    <meta property="og:description" content="One evidence-backed charity per cause." />
    <meta property="og:url" content="https://ripple-good.org/" />
    <meta property="og:image" content="https://ripple-good.org/og/default.png" />

    <meta name="twitter:image" content="https://ripple-good.org/og/default.png" />
